[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raytrain"
version = "0.1.0"
description = "Submit PyTorch DDP training jobs to KubeRay without writing YAML."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "raytrain contributors" }]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "kubernetes>=27.0",
    # optional at runtime on Kasm; required on RayJob side
    "mlflow>=2.10",
    "boto3>=1.28",
    "minio>=7.2",
    "rich>=13.0",
    # gitignore-style include/exclude patterns for code-sync zip building
    "pathspec>=0.11",
]

[project.optional-dependencies]
# Installed inside the training image, alongside the repo's own deps.
ray = ["ray[default]==2.54.1"]
dev = ["pytest", "ruff", "black"]
# Submission server (raytrain.server). Kept optional so CLI-only installs
# don't pull in the web stack. Install with: pip install raytrain[server]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
lance = ["pylance>=0.20", "pyarrow>=15.0"]
raydata = ["pylance>=0.20", "pyarrow>=15.0", "daft>=0.4"]

[project.scripts]
raytrain = "raytrain.cli.main:cli"
raytrain-driver = "raytrain.entrypoint.driver:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["raytrain*"]

[tool.setuptools.package-data]
"raytrain.templates" = ["*.j2", "*.yaml"]
