# nginx serves the built SPA and proxies API calls to raytrain-server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API + health → control plane (in-cluster Service DNS).
    location /v1/ {
        proxy_pass http://raytrain-server.raytrain-system.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE / streaming logs need buffering off
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /healthz {
        proxy_pass http://raytrain-server.raytrain-system.svc.cluster.local:8080;
    }

    # SPA fallback: every other path returns index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
