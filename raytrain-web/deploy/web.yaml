# raytrain-web deployment: serves the SPA + proxies /v1 to raytrain-server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raytrain-web
  namespace: raytrain-system
  labels:
    app: raytrain-web
    raytrain.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raytrain-web
  template:
    metadata:
      labels:
        app: raytrain-web
    spec:
      containers:
        - name: web
          image: 172.31.9.104:5050/raytrain/raytrain-web:v0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: raytrain-web
  namespace: raytrain-system
  labels:
    app: raytrain-web
spec:
  type: NodePort
  selector:
    app: raytrain-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30880
