# RBAC granting one modeler permission to submit / inspect / stop RayJobs and
# read logs inside the `ray-cluster-3` namespace.
#
# Apply once per user:
#   kubectl apply -f raytrain/deploy/rbac-raytrain-user.yaml
# After editing `subjects[0].name` to match the k8s identity that the user's
# Kasm kubeconfig authenticates as.
#
# If users authenticate as a group (e.g. `group: modelers`), change `kind: User`
# to `kind: Group`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: raytrain-user
  namespace: ray-cluster-3
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayjobs", "rayclusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  # Replace `zhangsan` in both this name and subjects[0].name.
  name: raytrain-user-zhangsan
  namespace: ray-cluster-3
subjects:
  - kind: User
    name: zhangsan
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: raytrain-user
  apiGroup: rbac.authorization.k8s.io
