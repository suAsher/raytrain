# supervisord manages the 4 IDE services inside a Workspace pod.
#
# Each program is wrapped so that:
#   - logs go to stdout/stderr (captured by `kubectl logs`)
#   - a service can be disabled via RAYTRAIN_ENABLED_IDES env (handled by the
#     start wrapper scripts, which exit 0 immediately if disabled)
#
# The container's main process is supervisord (PID 1 via tini in the image).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:jupyter]
command=/opt/raytrain-workspace/start-jupyter.sh
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:code-server]
command=/opt/raytrain-workspace/start-code-server.sh
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:pycharm]
command=/opt/raytrain-workspace/start-pycharm.sh
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:sshd]
command=/opt/raytrain-workspace/start-sshd.sh
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
