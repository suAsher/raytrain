[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raytrain-server"
version = "0.1.0"
description = "raytrain Platform control plane (FastAPI). Mediates between users and KubeRay/MinIO."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "raytrain platform team" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "minio>=7.2",
    "ray[default]>=2.54",
    "kubernetes>=27.0",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
raytrain-server = "raytrain_server.main:run"
raytrain-issue-token = "raytrain_server.scripts.issue_token:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["raytrain_server*"]
