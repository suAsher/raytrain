# Server config that DOESN'T contain secrets. Things that change per
# environment (dev / staging / prod) live here so the same image runs
# everywhere.
apiVersion: v1
kind: ConfigMap
metadata:
  name: raytrain-server-config
  namespace: raytrain-system
data:
  # MinIO endpoint (in-cluster service)
  RAYTRAIN_MINIO_ENDPOINT: "http://minio.waterpool.svc.cluster.local:9000"
  RAYTRAIN_MINIO_REGION: "us-east-1"
  RAYTRAIN_MINIO_SECURE: "false"
  RAYTRAIN_CODE_BUCKET: "raytrain-code"

  # Long-lived RayClusters: gpu_type -> Ray Job Submission API base URL.
  # Update once a new cluster comes online.
  RAYTRAIN_SHARED_CLUSTERS: |
    {
      "h20": "http://ray-shared-h20-head.raytrain-shared.svc.cluster.local:8265"
    }
  # Namespace where the shared RayClusters (and live RayJob head/worker pods)
  # run. Used to read a live job's real pods + events for the Job Detail page.
  RAYTRAIN_SHARED_NAMESPACE: "raytrain-shared"

  # MLflow tracking
  RAYTRAIN_MLFLOW_TRACKING_URI: "http://mlflow.mlflow.svc.cluster.local:5000"

  # Observability: cluster already has Loki + Prometheus. Empty → the console
  # reports logs/metrics as "unavailable" instead of synthesizing data.
  RAYTRAIN_LOKI_URL: "http://loki.loki.svc.cluster.local:3100"
  RAYTRAIN_PROMETHEUS_URL: "http://prometheus.monitoring.svc.cluster.local:9090"

  # Workspace NodePort access (current strategy; Ingress is a later evolution).
  # Externally reachable node host/IP users connect to for NodePort IDE/SSH.
  # Empty → fall back to the pod node's InternalIP.
  RAYTRAIN_WORKSPACE_NODE_HOST: ""
  RAYTRAIN_WORKSPACE_START_WAIT_S: "60"

  # Submission: reject submits whose gpu_type has no shared cluster (don't fake
  # a perpetually-Queued record). Set "true" only for cluster-less demos.
  RAYTRAIN_ALLOW_RECORD_ONLY_SUBMIT: "false"
  RAYTRAIN_STATUS_RECONCILE_INTERVAL_S: "30"

  # JWT settings
  RAYTRAIN_JWT_ISSUER: "raytrain-server"
  RAYTRAIN_JWT_DEFAULT_TTL_DAYS: "365"

  # Service
  RAYTRAIN_SERVER_HOST: "0.0.0.0"
  RAYTRAIN_SERVER_PORT: "8080"
  RAYTRAIN_LOG_LEVEL: "INFO"

  # Persistence (production): point at Postgres so jobs/resources/queue-meta
  # survive restarts, and disable demo seeding so the console shows only real
  # data. The DSN itself (with credentials) belongs in a Secret — set
  # RAYTRAIN_DATABASE_URL there and leave it unset here.
  #   RAYTRAIN_DATABASE_URL: postgresql://user:pass@postgres.raytrain-system:5432/raytrain
  RAYTRAIN_SEED_DEMO: "false"

  # Bootstrap admin for first browser login (username/password). Set the
  # password via a Secret in production, then remove after first login.
  RAYTRAIN_BOOTSTRAP_ADMIN_USER: "admin"
  # RAYTRAIN_BOOTSTRAP_ADMIN_PASSWORD: set in the raytrain-jwt-key Secret or a
  # dedicated Secret; do NOT commit a real password here.
