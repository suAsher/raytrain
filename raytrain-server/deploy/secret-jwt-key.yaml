# Secret holding the HMAC key used to sign JWTs.
#
# IMPORTANT — do NOT commit a real key. Generate one with:
#   openssl rand -hex 32
#
# and apply via:
#   kubectl -n raytrain-system create secret generic raytrain-jwt-key \
#       --from-literal=jwt_secret="<32-byte-hex>" \
#       --dry-run=client -o yaml | kubectl apply -f -
#
# Rotation: change the literal, re-apply, restart deploy/raytrain-server.
# All previously-issued tokens become invalid; new ones must be issued via
# `raytrain-issue-token`.
#
apiVersion: v1
kind: Secret
metadata:
  name: raytrain-jwt-key
  namespace: raytrain-system
type: Opaque
stringData:
  # PLACEHOLDER — overwrite before applying. The deployment will refuse to
  # start with this dev value (settings.jwt_secret guard).
  jwt_secret: "REPLACE_ME_WITH_OPENSSL_RAND_HEX_32"
---
# Secret holding MinIO credentials the server uses to PUT code zips.
#
# Generate a least-privilege user in MinIO with policy scoped to the code
# bucket; do NOT reuse the admin key.
apiVersion: v1
kind: Secret
metadata:
  name: raytrain-minio-creds
  namespace: raytrain-system
type: Opaque
stringData:
  access_key: "REPLACE_ME"
  secret_key: "REPLACE_ME"
