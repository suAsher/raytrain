# ServiceAccount for the control plane.
#
# What it can do:
#   - Talk to KubeRay (rayjobs / rayclusters) in raytrain-shared and the
#     legacy ray-cluster-3 namespace.
#   - Read/list pods + logs (for /v1/jobs/{id}/logs and admin views).
#   - Create/list ConfigMaps + Secrets in raytrain-system (for its own
#     state if needed).
#
# What it CANNOT do (deliberately):
#   - Touch any other namespace.
#   - Modify nodes, RBAC, CRDs.
#   - Read secrets it didn't create.
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: raytrain-server
  namespace: raytrain-system
  labels:
    raytrain.io/component: control-plane
---
# Permissions in raytrain-shared (the long-lived RayClusters live here)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: raytrain-server-shared
  namespace: raytrain-shared
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayjobs", "rayclusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: raytrain-server-shared
  namespace: raytrain-shared
subjects:
  - kind: ServiceAccount
    name: raytrain-server
    namespace: raytrain-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: raytrain-server-shared
---
# Permissions in raytrain-system (own state)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: raytrain-server-self
  namespace: raytrain-system
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: raytrain-server-self
  namespace: raytrain-system
subjects:
  - kind: ServiceAccount
    name: raytrain-server
    namespace: raytrain-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: raytrain-server-self
---
# Permissions in raytrain-workspaces (Workspace + DevSession pod lifecycle)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: raytrain-server-workspaces
  namespace: raytrain-workspaces
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: raytrain-server-workspaces
  namespace: raytrain-workspaces
subjects:
  - kind: ServiceAccount
    name: raytrain-server
    namespace: raytrain-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: raytrain-server-workspaces
