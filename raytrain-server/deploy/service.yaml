# In-cluster ClusterIP for the Web UI / other services to reach the API.
apiVersion: v1
kind: Service
metadata:
  name: raytrain-server
  namespace: raytrain-system
  labels:
    app: raytrain-server
spec:
  type: ClusterIP
  selector:
    app: raytrain-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# Convenience NodePort for the CLI users in M1 (until Ingress + HTTPS lands
# in M5). Pick a port in the 30000-32767 range that's free in your cluster.
apiVersion: v1
kind: Service
metadata:
  name: raytrain-server-nodeport
  namespace: raytrain-system
  labels:
    app: raytrain-server
spec:
  type: NodePort
  selector:
    app: raytrain-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30810
      protocol: TCP
